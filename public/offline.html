<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>Flareflow — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, sans-serif;
        background: #020617;
        color: #f8fafc;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #94a3b8;
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a {
        display: flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 0.9375rem;
        text-decoration: none;
      }
      .primary {
        background: #f59e0b;
        color: #020617;
      }
      .secondary {
        background: #1e293b;
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <h1>You are offline</h1>
    <p>
      Open My Jobs or Resume inspection below. If a link does not load, connect once while online
      and open each job from My Jobs before going offline again.
    </p>
    <div class="actions">
      <a class="primary" href="/dashboard/my-jobs">My Jobs</a>
      <a class="secondary" id="resume-inspection" href="/dashboard/my-jobs">Resume inspection</a>
    </div>
    <script>
      (function () {
        var key = "flareflow-active-inspection-id";
        var id = localStorage.getItem(key);
        var link = document.getElementById("resume-inspection");
        if (id && link) {
          link.href =
            "/inspect/offline?inspectionId=" + encodeURIComponent(id);
        }
      })();
    </script>
  </body>
</html>
